[package]
name = "nextline"
version = "0.2.1"
edition = "2024"
description = "Pre-script what you type in live demos and fire each step with a hotkey."
license = "MIT"
repository = "https://github.com/JW31254/nextline"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui-phosphor = "0.13"
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tray-icon = "0.26.1"
uuid = { version = "1.27.0", features = ["v4"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Media",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

